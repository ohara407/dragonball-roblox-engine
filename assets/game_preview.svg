<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Namek / Tournament of Power Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b091a"/>
      <stop offset="40%" stop-color="#191338"/>
      <stop offset="75%" stop-color="#2a1240"/>
      <stop offset="100%" stop-color="#080511"/>
    </linearGradient>

    <!-- Ground Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1833"/>
      <stop offset="30%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#08060f"/>
    </linearGradient>

    <!-- Super Saiyan Blue Aura Gradient -->
    <radialGradient id="ssjBlueAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#6bebff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#00aaff" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#0044cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#001155" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Freeza Aura Gradient -->
    <radialGradient id="goldenAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fff275" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#e5a900" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#664400" stop-opacity="0"/>
    </radialGradient>

    <!-- Beam Gradient (Kamehameha) -->
    <linearGradient id="kameBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#70e5ff"/>
      <stop offset="70%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0040aa"/>
    </linearGradient>

    <!-- HUD Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c0e18" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Environment -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Stars & Cosmic Energy -->
  <circle cx="150" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="320" cy="140" r="2" fill="#70e5ff" opacity="0.9"/>
  <circle cx="580" cy="60" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="890" cy="110" r="2.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="1050" cy="70" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="720" cy="180" r="1.2" fill="#6bebff" opacity="0.5"/>

  <!-- Distant Cosmic Nebula / Shattered Floating Arena Rocks -->
  <polygon points="120,380 210,340 260,390 190,430" fill="#251c3d" opacity="0.7"/>
  <polygon points="880,310 990,270 1060,330 950,370" fill="#291838" opacity="0.6"/>
  <polygon points="680,240 730,220 760,250 710,270" fill="#1b142b" opacity="0.5"/>

  <!-- 3D Arena Ground Grid -->
  <polygon points="0,460 1200,460 1200,675 0,675" fill="url(#groundGrad)"/>
  <path d="M 0,510 L 1200,510 M 0,570 L 1200,570 M 0,635 L 1200,635" stroke="#3b2b63" stroke-width="1.5" opacity="0.4"/>
  <path d="M 600,460 L 600,675 M 400,460 L 250,675 M 200,460 L 0,640 M 800,460 L 950,675 M 1000,460 L 1200,640" stroke="#3b2b63" stroke-width="1.5" opacity="0.4"/>

  <!-- Boss Aura (Golden Freeza - Right Side) -->
  <ellipse cx="880" cy="400" rx="140" ry="180" fill="url(#goldenAura)" filter="url(#highGlow)"/>
  <!-- Freeza Character Silhouette (Gold/Purple) -->
  <ellipse cx="880" cy="330" rx="28" ry="32" fill="#ffd700"/>
  <path d="M 870,315 Q 880,305 890,315 Q 880,335 870,315" fill="#800080"/> <!-- Head Gem -->
  <polygon points="860,360 900,360 915,440 845,440" fill="#ffd700"/>
  <rect x="868" y="375" width="24" height="40" rx="6" fill="#800080"/> <!-- Chest Gem -->
  <line x1="855" y1="440" x2="845" y2="520" stroke="#ffd700" stroke-width="14" stroke-linecap="round"/>
  <line x1="905" y1="440" x2="915" y2="520" stroke="#ffd700" stroke-width="14" stroke-linecap="round"/>

  <!-- Boss Boss Tag & Health Bar (Top Center/Right) -->
  <g transform="translate(680, 45)">
    <rect width="460" height="58" rx="8" fill="url(#hudBg)" stroke="#ffd700" stroke-width="2"/>
    <text x="18" y="24" fill="#ffd700" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" letter-spacing="1.5">CHEFÃO DE SAGA: GOLDEN FREEZA (100%)</text>
    <text x="380" y="24" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="13">8.4M / 10M HP</text>
    <!-- Bar Background -->
    <rect x="18" y="32" width="424" height="14" rx="4" fill="#301010"/>
    <!-- Bar Fill -->
    <rect x="18" y="32" width="356" height="14" rx="4" fill="#ff3333"/>
  </g>

  <!-- Energy Clash Beam / Kamehameha -->
  <path d="M 410,410 Q 600,390 850,405" stroke="url(#kameBeam)" stroke-width="38" stroke-linecap="round" filter="url(#highGlow)"/>
  <path d="M 410,410 Q 600,390 850,405" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Player Aura (Super Saiyajin Blue - Left Side) -->
  <ellipse cx="360" cy="410" rx="160" ry="210" fill="url(#ssjBlueAura)" filter="url(#highGlow)"/>

  <!-- Lightning Sparks (SSJ Blue / SSJ2 Energy) -->
  <path d="M 280,350 L 305,375 L 290,410 L 320,440" stroke="#c2f7ff" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M 430,320 L 415,355 L 440,380 L 420,420" stroke="#ffffff" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M 330,470 L 360,490 L 345,520" stroke="#70e5ff" stroke-width="2.5" fill="none"/>

  <!-- Player Saiyan Character (Roblox Blocky Style R15 in Battle Pose) -->
  <!-- SSJ Blue Spiky Hair -->
  <path d="M 330,300 L 310,230 L 340,260 L 360,200 L 380,255 L 420,225 L 395,295 Z" fill="#00e1ff" stroke="#0077b6" stroke-width="3" filter="url(#glow)"/>
  <!-- Head -->
  <rect x="338" y="295" width="48" height="42" rx="4" fill="#fcd5b4" stroke="#c48b62" stroke-width="1.5"/>
  <!-- Blue glowing eyes -->
  <rect x="350" y="312" width="8" height="6" fill="#00f0ff"/>
  <rect x="368" y="312" width="8" height="6" fill="#00f0ff"/>
  <!-- Torso (Goku Dogi - Orange & Blue undershirt) -->
  <polygon points="330,340 394,340 404,425 320,425" fill="#ff6b00" stroke="#c44900" stroke-width="2"/>
  <polygon points="348,340 376,340 380,380 344,380" fill="#0044aa"/>
  <rect x="336" y="415" width="52" height="14" fill="#003388"/> <!-- Blue Belt -->
  <!-- Arms Pushing Kamehameha Forward -->
  <line x1="330" y1="355" x2="400" y2="405" stroke="#ff6b00" stroke-width="18" stroke-linecap="round"/>
  <line x1="394" y1="355" x2="415" y2="410" stroke="#ff6b00" stroke-width="18" stroke-linecap="round"/>
  <!-- Blue Wristbands -->
  <circle cx="400" cy="405" r="10" fill="#0044aa"/>
  <circle cx="415" cy="410" r="10" fill="#0044aa"/>
  <!-- Hands firing Ki -->
  <circle cx="410" cy="410" r="16" fill="#ffffff" filter="url(#glow)"/>
  <!-- Legs in Stance -->
  <line x1="336" y1="428" x2="310" y2="525" stroke="#ff6b00" stroke-width="20" stroke-linecap="round"/>
  <line x1="388" y1="428" x2="415" y2="525" stroke="#ff6b00" stroke-width="20" stroke-linecap="round"/>
  <!-- Boots (Blue with red lace) -->
  <rect x="295" y="520" width="28" height="32" rx="4" fill="#003388"/>
  <rect x="405" y="520" width="28" height="32" rx="4" fill="#003388"/>

  <!-- Floating Combat Damage Text -->
  <text x="760" y="340" fill="#ffff00" font-family="'Impact', sans-serif" font-size="34" letter-spacing="1" stroke="#000" stroke-width="2" filter="url(#glow)">CRÍTICO! -1,450,200</text>
  <text x="790" y="295" fill="#00ffff" font-family="'Impact', sans-serif" font-size="24" stroke="#000" stroke-width="1.5">COMBO x24</text>

  <!-- ================= ROBLOX HUD (BOTTOM) ================= -->
  <!-- Main HUD Card Left -->
  <g transform="translate(40, 480)">
    <!-- Glassmorphism Container -->
    <rect width="440" height="160" rx="12" fill="url(#hudBg)" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Player Name & Transformation Badge -->
    <text x="24" y="34" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18">GUERREIRO: <tspan fill="#00ffff">Kakarotto_ADS</tspan></text>
    
    <rect x="270" y="16" width="145" height="24" rx="6" fill="#003366" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="342" y="32" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">★ SSJ BLUE (5,000x)</text>

    <!-- Power Level Display (Scouter Style) -->
    <rect x="24" y="46" width="392" height="30" rx="6" fill="#070a14" stroke="#ffaa00" stroke-width="1.5"/>
    <text x="36" y="66" fill="#ffaa00" font-family="monospace" font-weight="bold" font-size="14">PODER DE LUTA:</text>
    <text x="160" y="66" fill="#ffe600" font-family="monospace" font-weight="900" font-size="16" letter-spacing="1">50,000,000 PL</text>
    <text x="345" y="66" fill="#55ff55" font-family="monospace" font-size="12">Zenkai: 3x</text>

    <!-- Health Bar -->
    <text x="24" y="94" fill="#ff6b6b" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">VIDA</text>
    <text x="350" y="94" fill="#ffffff" font-family="monospace" font-size="11">4,200 / 5,000</text>
    <rect x="24" y="99" width="392" height="14" rx="4" fill="#331111"/>
    <rect x="24" y="99" width="330" height="14" rx="4" fill="#ff3333"/>

    <!-- Ki Bar -->
    <text x="24" y="130" fill="#6bebff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">KI DIVINO</text>
    <text x="350" y="130" fill="#ffffff" font-family="monospace" font-size="11">1,850 / 2,500</text>
    <rect x="24" y="135" width="392" height="14" rx="4" fill="#082038"/>
    <rect x="24" y="135" width="290" height="14" rx="4" fill="#00bfff"/>
  </g>

  <!-- Hotkey Action Bar (Center Bottom) -->
  <g transform="translate(520, 560)">
    <rect width="440" height="80" rx="10" fill="url(#hudBg)" stroke="#3b2b63" stroke-width="2"/>
    
    <!-- Key [C] Charge -->
    <g transform="translate(20, 15)">
      <rect width="65" height="50" rx="8" fill="#1b2444" stroke="#00aaff" stroke-width="1.5"/>
      <text x="32" y="28" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">[C]</text>
      <text x="32" y="42" fill="#70e5ff" font-family="sans-serif" font-size="9" text-anchor="middle">Carregar Ki</text>
    </g>

    <!-- Key [G] Transform -->
    <g transform="translate(100, 15)">
      <rect width="65" height="50" rx="8" fill="#3a2810" stroke="#ffd700" stroke-width="1.5"/>
      <text x="32" y="28" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">[G]</text>
      <text x="32" y="42" fill="#ffd700" font-family="sans-serif" font-size="9" text-anchor="middle">Transformar</text>
    </g>

    <!-- Key [H] Revert -->
    <g transform="translate(180, 15)">
      <rect width="65" height="50" rx="8" fill="#201a2c" stroke="#aa88ff" stroke-width="1.5"/>
      <text x="32" y="28" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">[H]</text>
      <text x="32" y="42" fill="#aa88ff" font-family="sans-serif" font-size="9" text-anchor="middle">Forma Base</text>
    </g>

    <!-- Key [T] Train -->
    <g transform="translate(260, 15)">
      <rect width="65" height="50" rx="8" fill="#143320" stroke="#22cc66" stroke-width="1.5"/>
      <text x="32" y="28" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">[T]</text>
      <text x="32" y="42" fill="#55ff88" font-family="sans-serif" font-size="9" text-anchor="middle">Treinar 100G</text>
    </g>

    <!-- Key [Q] Dash -->
    <g transform="translate(340, 15)">
      <rect width="65" height="50" rx="8" fill="#331422" stroke="#ff2266" stroke-width="1.5"/>
      <text x="32" y="28" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">[Q]</text>
      <text x="32" y="42" fill="#ff5588" font-family="sans-serif" font-size="9" text-anchor="middle">Ki Dash</text>
    </g>
  </g>

  <!-- Top Left: Backend Status & Google Gemini AI Indicator -->
  <g transform="translate(40, 30)">
    <rect width="320" height="70" rx="8" fill="url(#hudBg)" stroke="#00e1ff" stroke-width="1.5"/>
    <circle cx="25" cy="28" r="6" fill="#00ff66" filter="url(#glow)"/>
    <text x="40" y="32" fill="#00ff66" font-family="monospace" font-weight="bold" font-size="13">PYTHON FASTAPI: ONLINE (8000)</text>
    <text x="25" y="55" fill="#a0b0d0" font-family="'Segoe UI', sans-serif" font-size="12">IA Gemini: <tspan fill="#ffd700">Design de VFX &amp; Roteiros Ativo</tspan></text>
  </g>

  <!-- Watermark / Title Top -->
  <text x="600" y="110" fill="#ffffff" font-family="'Impact', sans-serif" font-size="32" letter-spacing="4" text-anchor="middle" opacity="0.25">DRAGON BALL: SAIYAN ODYSSEY</text>
</svg>
